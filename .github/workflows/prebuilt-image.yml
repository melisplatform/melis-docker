name: Pre-built Melis image

# Builds and publishes the pre-built Melis image (prebuilt/Dockerfile), which
# bakes the Melis skeleton at build time. Pushes to Docker Hub only on master
# pushes and version tags; pull requests build-only (no push, no secrets needed).

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'prebuilt/**'
      - '.github/workflows/prebuilt-image.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'prebuilt/**'
      - '.github/workflows/prebuilt-image.yml'
  workflow_dispatch:

env:
  IMAGE: melisplatform/melis-docker
  PHP_TAG: php8.3

jobs:
  prebuilt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only push on master / tags, and only when Docker Hub creds are configured.
      - name: Decide whether to push
        id: cfg
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest + php-version tag on master; add the git tag (e.g. v5.3.0) on tags.
      - name: Docker metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.PHP_TAG }},enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push (prebuilt/)
        uses: docker/build-push-action@v6
        with:
          context: ./prebuilt
          file: ./prebuilt/Dockerfile
          push: ${{ steps.cfg.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
