name: Pre-built Melis images

# Builds and publishes the pre-built Melis images that bake the skeleton at build
# time: the Apache (mod_php) image from prebuilt/, and the nginx + PHP-FPM image
# from fpm/. Pushes to Docker Hub only on master pushes and version tags; pull
# requests build-only (no push, no secrets needed).

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'prebuilt/**'
      - 'fpm/**'
      - '.github/workflows/prebuilt-image.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'prebuilt/**'
      - 'fpm/**'
      - '.github/workflows/prebuilt-image.yml'
  workflow_dispatch:

env:
  IMAGE: melisplatform/melis-docker

jobs:
  baked:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apache (mod_php) pre-built image → latest / php8.3
          - dir: prebuilt
            latest: latest
            pinned: php8.3
            tagsuffix: ""
          # nginx + PHP-FPM pre-built image → fpm-latest / fpm-php8.3
          - dir: fpm
            latest: fpm-latest
            pinned: fpm-php8.3
            tagsuffix: "-fpm"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Only push on master / tags, and only when Docker Hub creds are configured.
      - name: Decide whether to push
        id: cfg
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.latest }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.pinned }},enable={{is_default_branch}}
            type=ref,event=tag,suffix=${{ matrix.tagsuffix }}

      - name: Build and push (${{ matrix.dir }}/)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.dir }}
          file: ./${{ matrix.dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
