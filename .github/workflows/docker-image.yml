name: Dev base images

# Builds the per-PHP-version Melis dev base images under dev/ — both the Apache
# (mod_php) and PHP-FPM variants, PHP 8.1–8.5 (composer constraint ^8.1|^8.3).
# 8.4 and 8.5 build on the maintained Laminas forks (see melis-core#24) and are
# experimental — not yet officially listed by Melis. Pushes to Docker Hub as
# melisplatform/melis-docker:dev-{apache,fpm}-<version> on master only; pull
# requests build without pushing (no secrets required).

on:
  push:
    branches: [ master ]
    paths:
      - 'dev/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'dev/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  IMAGE: melisplatform/melis-docker

jobs:
  dev-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ["apache", "fpm"]
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Decide whether to push
        id: cfg
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev-${{ matrix.variant }}-${{ matrix.php }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./dev/php-${{ matrix.variant }}-${{ matrix.php }}
          file: ./dev/php-${{ matrix.variant }}-${{ matrix.php }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push }}
          tags: ${{ env.IMAGE }}:dev-${{ matrix.variant }}-${{ matrix.php }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
