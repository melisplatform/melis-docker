# Melis Platform — nginx server block, proxies PHP to php-fpm (service "php":9000)
server {
    listen 80;
    server_name localhost;

    root /var/www/melis/public;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Static assets — let nginx serve them directly
    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles (e.g. .env, .git) except ACME challenges
    location ~ /\.(?!well-known) {
        deny all;
    }
}
