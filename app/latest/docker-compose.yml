services:
  php:
    container_name: ${MELIS_CONTAINER_NAME}-php
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - APP_NAME=${APP_NAME}
        - TZ=${TZ}
        - MELIS_PLATFORM=${MELIS_PLATFORM}
        - MELIS_MODULE=${MELIS_MODULE}
      x-bake:
        cache-from: ["type=local,src=/tmp/.buildx-cache"]
        cache-to: ["type=local,dest=/tmp/.buildx-cache"]
    ports:
      - 8080:80
    volumes:
      - ../../../:/var/www/${APP_NAME}
      - composer-cache:/root/.composer/cache
    environment:
      # Host without ":port" — a "host:port" value breaks Melis' flyway/JDBC URL.
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME}-db
      MELIS_PLATFORM: ${MELIS_PLATFORM}
      MELIS_MODULE: ${MELIS_MODULE}
      MYSQL_HOST: ${MELIS_CONTAINER_NAME}-db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - melis
    restart: unless-stopped

  db:
    image: mysql:${MYSQL_VERSION}
    container_name: ${MELIS_CONTAINER_NAME}-db
    env_file: ./.env
    volumes:
      - melis_mysql_data:/var/lib/mysql
    restart: always
    ports:
      # Bound to localhost only (DB not exposed on the LAN)
      - 127.0.0.1:33061:${MYSQL_PORT}
    environment:
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME}-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      # NB: --default-authentication-plugin was removed in MySQL 8.4; rely on the
      # server default (caching_sha2_password), which PHP 8.x connects to natively.
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melis

networks:
  melis:
    name: ${MELIS_CONTAINER_NAME}-network
    driver: bridge

volumes:
  melis_mysql_data:
    name: ${MELIS_CONTAINER_NAME}-mysql-data
  composer-cache:
    name: ${MELIS_CONTAINER_NAME}-composer-cache